<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Purple-heavy gradient -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F0ABFC"/>
      <stop offset="35%" stop-color="#C026D3"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Background bloom/vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a0a4a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0a0015" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#070014" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon bloom glow (for foreground shapes/text only) -->
    <filter id="neon" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="auraAlpha"/>
      <feFlood flood-color="#C026D3" flood-opacity="0.95" result="auraColor"/>
      <feComposite in="auraColor" in2="auraAlpha" operator="in" result="aura"/>
      <feGaussianBlur in="aura" stdDeviation="18" result="auraBlur"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="midAlpha"/>
      <feFlood flood-color="#A855F7" flood-opacity="1" result="midColor"/>
      <feComposite in="midColor" in2="midAlpha" operator="in" result="mid"/>
      <feGaussianBlur in="mid" stdDeviation="10" result="midBlur"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="coreAlpha"/>
      <feFlood flood-color="#E879F9" flood-opacity="1" result="coreColor"/>
      <feComposite in="coreColor" in2="coreAlpha" operator="in" result="core"/>
      <feGaussianBlur in="core" stdDeviation="3.5" result="coreBlur"/>

      <feMerge>
        <feMergeNode in="auraBlur"/>
        <feMergeNode in="midBlur"/>
        <feMergeNode in="coreBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for background hashes (subtle) -->
    <filter id="bgSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="a"/>
      <feFlood flood-color="#A855F7" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="a" operator="in" result="g1"/>
      <feGaussianBlur in="g1" stdDeviation="2.6" result="g2"/>
      <feMerge>
        <feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Reusable # symbol (centered at 0,0) -->
    <symbol id="hash" viewBox="-50 -50 100 100">
      <rect x="-28" y="-42" width="12" height="84" rx="6"/>
      <rect x="16"  y="-42" width="12" height="84" rx="6"/>
      <rect x="-44" y="-18" width="88" height="12" rx="6"/>
      <rect x="-44" y="18"  width="88" height="12" rx="6"/>
    </symbol>

    <style>
      .bg { fill:url(#bgGlow); }

      /* background hashes */
      .bh  { fill:#A855F7; opacity:.12; filter:url(#bgSoft); }
      .bh2 { fill:#C026D3; opacity:.10; filter:url(#bgSoft); }

      /* foreground */
      .shape { fill:url(#g); opacity:1; filter:url(#neon); }
      .soft  { opacity:.45; }
      .line  { stroke:url(#g); stroke-width:2.6; opacity:.85; filter:url(#neon); fill:none; }

      text { font-family: ui-sans-serif, system-ui, Segoe UI, Arial; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="320"/>

  <!-- MANY small hashes in the background (static scatter = “floating” look in GitHub) -->
  <g id="bgHashes">
    <!-- top band -->
    <use href="#hash" class="bh"  transform="translate(80 55)  scale(.10) rotate(-12)"/>
    <use href="#hash" class="bh2" transform="translate(145 42) scale(.08) rotate(18)"/>
    <use href="#hash" class="bh"  transform="translate(215 62) scale(.09) rotate(8)"/>
    <use href="#hash" class="bh2" transform="translate(285 38) scale(.07) rotate(-20)"/>
    <use href="#hash" class="bh"  transform="translate(350 58) scale(.10) rotate(14)"/>
    <use href="#hash" class="bh2" transform="translate(420 46) scale(.08) rotate(-8)"/>
    <use href="#hash" class="bh"  transform="translate(495 60) scale(.09) rotate(22)"/>
    <use href="#hash" class="bh2" transform="translate(570 40) scale(.07) rotate(-14)"/>
    <use href="#hash" class="bh"  transform="translate(640 62) scale(.10) rotate(10)"/>
    <use href="#hash" class="bh2" transform="translate(710 45) scale(.08) rotate(-24)"/>
    <use href="#hash" class="bh"  transform="translate(785 58) scale(.09) rotate(16)"/>
    <use href="#hash" class="bh2" transform="translate(860 42) scale(.07) rotate(-10)"/>
    <use href="#hash" class="bh"  transform="translate(930 60) scale(.10) rotate(6)"/>
    <use href="#hash" class="bh2" transform="translate(1005 44) scale(.08) rotate(-18)"/>
    <use href="#hash" class="bh"  transform="translate(1080 58) scale(.09) rotate(20)"/>

    <!-- mid scatter -->
    <use href="#hash" class="bh2" transform="translate(110 125) scale(.07) rotate(8)"/>
    <use href="#hash" class="bh"  transform="translate(210 150) scale(.08) rotate(-16)"/>
    <use href="#hash" class="bh2" transform="translate(310 120) scale(.07) rotate(20)"/>
    <use href="#hash" class="bh"  transform="translate(405 160) scale(.09) rotate(-10)"/>
    <use href="#hash" class="bh2" transform="translate(505 135) scale(.07) rotate(14)"/>
    <use href="#hash" class="bh"  transform="translate(615 150) scale(.08) rotate(-22)"/>
    <use href="#hash" class="bh2" transform="translate(720 125) scale(.07) rotate(10)"/>
    <use href="#hash" class="bh"  transform="translate(820 155) scale(.09) rotate(-12)"/>
    <use href="#hash" class="bh2" transform="translate(920 132) scale(.07) rotate(24)"/>
    <use href="#hash" class="bh"  transform="translate(1040 155) scale(.08) rotate(-8)"/>

    <!-- bottom scatter -->
    <use href="#hash" class="bh"  transform="translate(160 260) scale(.09) rotate(12)"/>
    <use href="#hash" class="bh2" transform="translate(260 235) scale(.07) rotate(-18)"/>
    <use href="#hash" class="bh"  transform="translate(360 270) scale(.10) rotate(8)"/>
    <use href="#hash" class="bh2" transform="translate(460 242) scale(.07) rotate(20)"/>
    <use href="#hash" class="bh"  transform="translate(560 265) scale(.09) rotate(-10)"/>
    <use href="#hash" class="bh2" transform="translate(660 235) scale(.07) rotate(14)"/>
    <use href="#hash" class="bh"  transform="translate(760 270) scale(.10) rotate(-16)"/>
    <use href="#hash" class="bh2" transform="translate(860 242) scale(.07) rotate(18)"/>
    <use href="#hash" class="bh"  transform="translate(960 265) scale(.09) rotate(-8)"/>
    <use href="#hash" class="bh2" transform="translate(1060 238) scale(.07) rotate(22)"/>
  </g>

  <!-- neon wave -->
  <path class="line" d="M0,222 C180,182 360,262 540,222 C720,182 900,262 1200,207">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,222 C180,182 360,262 540,222 C720,182 900,262 1200,207;
        M0,212 C220,262 380,152 560,212 C740,272 930,162 1200,222;
        M0,222 C180,182 360,262 540,222 C720,182 900,262 1200,207
      "/>
  </path>

  <!-- Foreground # blobs -->
  <use class="shape soft" href="#hash">
    <animate attributeName="transform" dur="6.8s" repeatCount="indefinite"
      values="
        translate(185 125) scale(1.45) rotate(-8);
        translate(245 95)  scale(1.85) rotate(10);
        translate(185 125) scale(1.45) rotate(-8)
      "/>
  </use>

  <use class="shape" href="#hash">
    <animate attributeName="transform" dur="7.2s" repeatCount="indefinite"
      values="
        translate(985 110) scale(0.90) rotate(12);
        translate(925 150) scale(0.90) rotate(-18);
        translate(985 110) scale(0.90) rotate(12)
      "/>
  </use>

  <use class="shape soft" href="#hash">
    <animate attributeName="transform" dur="8.0s" repeatCount="indefinite"
      values="
        translate(760 236) scale(1.25) rotate(6);
        translate(830 205) scale(1.25) rotate(-10);
        translate(760 236) scale(1.25) rotate(6)
      "/>
  </use>

  <!-- rotating hex -->
  <g transform="translate(560 120)" filter="url(#neon)">
    <g>
      <polygon class="shape" points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- drifting squares -->
  <g class="shape soft">
    <rect x="70" y="250" width="18" height="18" rx="4">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" values="70;145;70"/>
      <animate attributeName="y" dur="6s" repeatCount="indefinite" values="250;208;250"/>
      <animateTransform attributeName="transform" type="rotate" dur="7s" repeatCount="indefinite"
        from="0 79 259" to="360 79 259"/>
    </rect>

    <rect x="1080" y="240" width="22" height="22" rx="5">
      <animate attributeName="x" dur="10s" repeatCount="indefinite" values="1080;995;1080"/>
      <animate attributeName="y" dur="7s" repeatCount="indefinite" values="240;268;240"/>
      <animateTransform attributeName="transform" type="rotate" dur="8s" repeatCount="indefinite"
        from="0 1091 251" to="-360 1091 251"/>
    </rect>
  </g>

  <!-- title -->
  <g>
    <text x="50%" y="62%" text-anchor="middle"
      font-size="46" fill="#FFFFFF" opacity="0.95" letter-spacing="1"
      filter="url(#neon)">
      MARCO THARWAT HESHMAT
    </text>

    <text x="50%" y="62%" text-anchor="middle"
      font-size="46" fill="#FFFFFF" opacity="0.98" letter-spacing="1">
      MARCO THARWAT HESHMAT
    </text>

    <text x="50%" y="75%" text-anchor="middle"
      font-size="18" fill="#F5F3FF" opacity="0.85" filter="url(#neon)">
      &#46;NET Backend Developer • ASP&#46;NET Core • C# • SQL Server
    </text>

    <text x="50%" y="75%" text-anchor="middle"
      font-size="18" fill="#FFFFFF" opacity="0.92">
      &#46;NET Backend Developer • ASP&#46;NET Core • C# • SQL Server
    </text>
  </g>
</svg>
