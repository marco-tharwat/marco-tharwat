<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Purple-heavy gradient -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F0ABFC"/>
      <stop offset="35%" stop-color="#C026D3"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Background bloom/vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a0a4a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0a0015" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#070014" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon bloom glow -->
    <filter id="neon" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="auraAlpha"/>
      <feFlood flood-color="#C026D3" flood-opacity="0.95" result="auraColor"/>
      <feComposite in="auraColor" in2="auraAlpha" operator="in" result="aura"/>
      <feGaussianBlur in="aura" stdDeviation="18" result="auraBlur"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="midAlpha"/>
      <feFlood flood-color="#A855F7" flood-opacity="1" result="midColor"/>
      <feComposite in="midColor" in2="midAlpha" operator="in" result="mid"/>
      <feGaussianBlur in="mid" stdDeviation="10" result="midBlur"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="coreAlpha"/>
      <feFlood flood-color="#E879F9" flood-opacity="1" result="coreColor"/>
      <feComposite in="coreColor" in2="coreAlpha" operator="in" result="core"/>
      <feGaussianBlur in="core" stdDeviation="3.5" result="coreBlur"/>

      <feMerge>
        <feMergeNode in="auraBlur"/>
        <feMergeNode in="midBlur"/>
        <feMergeNode in="coreBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg { fill:url(#bgGlow); }
      .line  { stroke:url(#g); stroke-width:2.2; opacity:.75; filter:url(#neon); fill:none; }
      .hash  { stroke:url(#g); stroke-width:3; stroke-linecap:round; opacity:.9; filter:url(#neon); }
      .hashSoft { opacity:.45; }
      text { font-family: ui-sans-serif, system-ui, Segoe UI, Arial; }
    </style>

    <!-- Reusable hash mark (drawn, not a font) -->
    <g id="hash">
      <!-- two verticals -->
      <line class="hash" x1="-6" y1="-10" x2="-6" y2="10"/>
      <line class="hash" x1="6"  y1="-10" x2="6"  y2="10"/>
      <!-- two horizontals -->
      <line class="hash" x1="-12" y1="-4" x2="12" y2="-4"/>
      <line class="hash" x1="-12" y1="4"  x2="12" y2="4"/>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="320"/>

  <!-- neon wave -->
  <path class="line" d="M0,222 C180,182 360,262 540,222 C720,182 900,262 1200,207">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,222 C180,182 360,262 540,222 C720,182 900,262 1200,207;
        M0,212 C220,262 380,152 560,212 C740,272 930,162 1200,222;
        M0,222 C180,182 360,262 540,222 C720,182 900,262 1200,207
      "/>
  </path>

  <!-- scattered neon hashes -->
  <g>
    <use href="#hash" transform="translate(120 70) rotate(12) scale(1.3)"/>
    <use href="#hash" class="hashSoft" transform="translate(190 210) rotate(-18) scale(0.9)"/>
    <use href="#hash" transform="translate(320 120) rotate(25) scale(1.0)"/>
    <use href="#hash" class="hashSoft" transform="translate(420 60) rotate(-10) scale(0.8)"/>
    <use href="#hash" transform="translate(520 250) rotate(8) scale(1.1)"/>
    <use href="#hash" class="hashSoft" transform="translate(640 90) rotate(20) scale(0.85)"/>
    <use href="#hash" transform="translate(740 170) rotate(-22) scale(1.0)"/>
    <use href="#hash" class="hashSoft" transform="translate(860 250) rotate(16) scale(0.9)"/>
    <use href="#hash" transform="translate(980 80) rotate(-8) scale(1.2)"/>
    <use href="#hash" class="hashSoft" transform="translate(1080 190) rotate(10) scale(0.8)"/>
  </g>

  <!-- a few moving hashes (may animate depending on GitHub rendering) -->
  <g class="hashSoft">
    <use href="#hash" transform="translate(90 150) rotate(0) scale(0.9)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        dur="7s" repeatCount="indefinite" values="0 0; 30 -18; 0 0"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        dur="6s" repeatCount="indefinite" values="0; 180; 360"/>
    </use>

    <use href="#hash" transform="translate(1040 140) rotate(0) scale(0.95)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        dur="8s" repeatCount="indefinite" values="0 0; -36 20; 0 0"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        dur="7s" repeatCount="indefinite" values="0; -180; -360"/>
    </use>
  </g>

  <!-- title + subtitle (glow + crisp overlay) -->
  <g>
    <text x="50%" y="62%" text-anchor="middle"
      font-size="46" fill="#FFFFFF" opacity="0.95" letter-spacing="1"
      filter="url(#neon)">
      MARCO THARWAT HESHMAT
    </text>
    <text x="50%" y="62%" text-anchor="middle"
      font-size="46" fill="#FFFFFF" opacity="0.98" letter-spacing="1">
      MARCO THARWAT HESHMAT
    </text>

    <!-- subtitle glow (behind) -->
    <text x="50%" y="75%" text-anchor="middle"
      font-size="18" fill="#F5F3FF" opacity="0.85" filter="url(#neon)">
      &#46;NET Backend Developer • ASP&#46;NET Core • C# • SQL Server
    </text>
    <!-- subtitle crisp (on top) -->
    <text x="50%" y="75%" text-anchor="middle"
      font-size="18" fill="#FFFFFF" opacity="0.92">
      &#46;NET Backend Developer • ASP&#46;NET Core • C# • SQL Server
    </text>
  </g>
</svg>
